<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA Final - Suggested Answers &amp; Certified Copies</title>
<meta name="description" content="ICAI suggested answers and certified copies for every CA Final attempt from May 2018.">
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1c2030;--muted:#677087;--line:#dde1ec;--accent:#2f5bea;--accent-t:#fff;--warn-bg:#fff6e0;--warn-t:#7a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--text:#e8ebf5;--muted:#9aa3bb;--line:#2b3042;--accent:#6c8cff;--accent-t:#0e1220;--warn-bg:#3a2f10;--warn-t:#f1d58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--text:#e8ebf5;--muted:#9aa3bb;--line:#2b3042;--accent:#6c8cff;--accent-t:#0e1220;--warn-bg:#3a2f10;--warn-t:#f1d58a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.boxes{grid-template-columns:1fr}}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
select{width:100%;padding:12px;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px}
select:disabled{opacity:.5}
select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#out{margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 4px}
.tag{display:inline-block;font-size:.75rem;color:var(--muted);margin-bottom:12px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-t);text-decoration:none;font-weight:600;padding:12px 18px;border-radius:10px}
.btn:hover{filter:brightness(1.08)}
.note{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.warn{background:var(--warn-bg);color:var(--warn-t);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.more{font-size:.9rem;margin-top:6px}
.more a{color:var(--accent)}
.cc{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.cc h3{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.cc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cc a{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none}
.cc a:hover{border-color:var(--accent)}
.cc .who{min-width:0;overflow-wrap:anywhere}
.cc .rk{font-weight:600}
.cc .mk{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>CA Final - Suggested Answers &amp; Certified Copies</h1>
<p class="sub">Pick a subject, year and attempt to get the ICAI suggested answers and toppers' certified copies.</p>
<div class="boxes">
 <div><label for="sub">Subject</label><select id="sub"></select></div>
 <div><label for="yr">Year</label><select id="yr"></select></div>
 <div><label for="mo">Month</label><select id="mo"></select></div>
</div>
<div id="out" aria-live="polite"></div>
</main>
<script>
// Every link comes from manifest.json, which admin.html updates when you upload.
const FILE_BASE="";
const SUBJECTS={FR:"Financial Reporting (FR)",AFM:"Advanced Financial Management (AFM)",AUD:"Advanced Auditing, Assurance & Professional Ethics",DT:"Direct Tax Laws & International Taxation (DT)",IDT:"Indirect Tax Laws (IDT)",IBS:"Integrated Business Solutions (IBS)"};
const N16={FR:"Paper 1 – Financial Reporting",AFM:"Paper 2 – Strategic Financial Management (SFM)",AUD:"Paper 3 – Advanced Auditing & Professional Ethics",DT:"Paper 7 – Direct Tax Laws & International Taxation",IDT:"Paper 8 – Indirect Tax Laws",IBS:"Paper 6F – Multidisciplinary Case Study (precursor of IBS)"};
const MORD={Jan:1,May:2,Jul:3,Sep:4,Nov:5,Dec:6};
const MNAME={Jan:"January",May:"May",Jul:"July",Sep:"September",Nov:"November",Dec:"December"};
// Attempts before May 2024 were under the 2016 scheme, with the old paper names.
const isOld=(y,m)=>(+y)*10+MORD[m]<2024*10+MORD.May;
const $=id=>document.getElementById(id);
const sub=$("sub"),yr=$("yr"),mo=$("mo"),out=$("out");
let DATA={},PAGES={};
function fill(sel,ph,items){sel.innerHTML="";const o=document.createElement("option");o.value="";o.textContent=ph;sel.appendChild(o);items.forEach(([v,t])=>{const e=document.createElement("option");e.value=v;e.textContent=t;sel.appendChild(e)})}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const url=f=>/^https?:/.test(f)?f:FILE_BASE+f;
function slot(a){const[y,m]=a.split("-");DATA[y]=DATA[y]||{};return DATA[y][m]=DATA[y][m]||{sa:{},cc:{}}}
function build(man){
 DATA={};PAGES=man.pages||{};
 (man.suggested||[]).forEach(e=>{slot(e.attempt).sa[e.subject]=e});
 (man.certified||[]).forEach(e=>{const c=slot(e.attempt).cc;(c[e.subject]=c[e.subject]||[]).push(e)});
 Object.values(DATA).forEach(ms=>Object.values(ms).forEach(a=>Object.values(a.cc).forEach(l=>l.sort((x,y)=>y.marks/y.max-x.marks/x.max||x.n-y.n))));
}
function init(){
 fill(sub,"Select subject",Object.entries(SUBJECTS));
 fill(yr,"Select year",Object.keys(DATA).sort((a,b)=>b-a).map(y=>[y,y]));
 fill(mo,"Select year first",[]);mo.disabled=true;render();
}
yr.addEventListener("change",()=>{
 if(!yr.value){fill(mo,"Select year first",[]);mo.disabled=true}
 else{const ms=Object.keys(DATA[yr.value]).sort((a,b)=>MORD[a]-MORD[b]);fill(mo,"Select month",ms.map(m=>[m,MNAME[m]]));mo.disabled=false}
 render()});
sub.addEventListener("change",render);mo.addEventListener("change",render);
function render(){
 out.innerHTML="";
 if(!(sub.value&&yr.value&&mo.value)){out.appendChild(el("div","empty","Choose all three to see the links."));return}
 const att=DATA[yr.value][mo.value],s=sub.value,old=isOld(yr.value,mo.value);
 const it=att.sa[s],ccs=att.cc[s]||[];
 const c=el("div","card");
 c.appendChild(el("h2","",old?N16[s]:SUBJECTS[s]));
 c.appendChild(el("div","tag",MNAME[mo.value]+" "+yr.value));
 if(it){
  const a=el("a","btn","Open suggested answers (PDF)");a.href=url(it.file);a.target="_blank";a.rel="noopener";
  const box=el("div");box.appendChild(a);c.appendChild(box);
  if(it.unofficial)c.appendChild(el("div","warn","Unofficial copy (not from ICAI's portal)."));
 }else c.appendChild(el("p","note","No suggested answers for this paper"+(s==="IBS"&&old?" (IBS exists only from the 2023 scheme; earlier attempts used the Paper 6F case study).":".")));
 if(ccs.length){
  const d=el("div","cc");d.appendChild(el("h3","","Certified copies ("+ccs.length+")"));
  const ul=el("ul");
  ccs.forEach(e=>{const li=el("li"),a=el("a");a.href=url(e.file);a.target="_blank";a.rel="noopener";
   const w=el("span","who");w.appendChild(el("span","rk",e.name||e.rank||"Certified copy"));if(e.name&&e.rank)w.appendChild(document.createTextNode(" ("+e.rank+")"));
   a.appendChild(w);a.appendChild(el("span","mk",e.marks+" / "+e.max));li.appendChild(a);ul.appendChild(li)});
  d.appendChild(ul);c.appendChild(d);
 }
 out.appendChild(c);
 const pg=PAGES[yr.value+"-"+mo.value];
 if(pg){const d=el("div","more");const a=el("a","","All papers for this attempt on ICAI's site ↗");a.href=pg;a.target="_blank";a.rel="noopener";d.appendChild(a);out.appendChild(d)}
}
fetch("manifest.json?v="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(m=>{build(m);init()})
 .catch(()=>{out.innerHTML="";out.appendChild(el("div","empty","Couldn't load the list of papers. Refresh the page to try again."))});
</script>
</body>
</html>
